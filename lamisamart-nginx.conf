server {
    # Listen on port 80 (HTTP). 
    # NGINX uses the server_name to distinguish this app from your other app on port 80.
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain name or subdomain for LamisaMart
    server_name lamisamart.elink.bd www.lamisamart.elink.bd;

    # Point to the ASP.NET Core application running on port 8080
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Optional: Increase max upload size if vendors upload large images
    client_max_body_size 20M;
}
